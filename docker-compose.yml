version: '3.8'

services:
  # PostgreSQL with pgvector extension
  postgres:
    image: pgvector/pgvector:pg16
    container_name: jobzy-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: jobzy
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Redis for BullMQ background queue
  redis:
    image: redis:7-alpine
    container_name: jobzy-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # Backend Server
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: jobzy-server
    restart: always
    environment:
      PORT: 5001
      NODE_ENV: production
      DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/jobzy?schema=public"
      REDIS_URL: "redis://redis:6379"
      JWT_SECRET: "jobzy_enterprise_grade_security_jwt_secret_token_2026"
      CLIENT_URL: "http://localhost:5173"
    ports:
      - "5001:5001"
    depends_on:
      - postgres
      - redis
    volumes:
      - ./uploads:/app/uploads

  # Frontend Client
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: jobzy-client
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - server

volumes:
  postgres_data:
  redis_data:
